services:
  ziwei:
    image: thomasyuan/ziwei:1.0.0
    # 也可以直接本地构建：docker compose up --build
    # build: .
    ports:
      - "9999:3000"          # 发布在 0.0.0.0，局域网可访问：http://<本机IP>:9999
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # AI 追问（不配也能跑：排盘与规则解读不需要 Key）
      # AI_PROVIDER: deepseek
      # AI_API_KEY: sk-...
      # AI_MODEL: deepseek-chat
      # AI_BASE_URL: https://api.deepseek.com/v1
    restart: unless-stopped

services:
  ziwei:
    image: thomasyuan/ziwei:1.0.0
    # 也可以直接本地构建：docker compose up --build
    # build: .
    ports:
      - "9999:3000"          # 发布在 0.0.0.0，局域网可访问：http://<本机IP>:9999
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # 这里没有 AI Key 要配：Key 由用户在页面的「设置 Key」填，只存在他自己的浏览器里，
      # 排盘页 / 合盘页由浏览器直连厂商接口，容器不经手、不留日志。
    restart: unless-stopped
